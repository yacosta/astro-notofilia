  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Notofilia", "item": "https://www.notofilia.com/" },

  }
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async="{{ true }}" defer="{{ true }}"></script>

  <link rel="stylesheet" href="/catalog-fonts.css">

  body { margin: 0; }
    a { color: #6b521f; text-decoration: underline; text-decoration-color: rgba(138,109,59,0.35); }

<div style="width:100%; min-height:100vh; background:#0a0a09; font-family:'Cormorant Garamond', serif; box-sizing:border-box;">

  <a
    href="#main-content"
    style="position:absolute; top:-60px; left:16px; z-index:20; background:#d8d2cd; color:#0a0a09; font-family:'Cormorant Garamond', serif; font-weight:600; font-size:15px; letter-spacing:0.05em; padding:12px 20px; border-radius:2px; text-decoration:none; transition:top 0.15s ease;"
    style-focus="top:16px;"
  >Saltar al contenido principal</a>

  <dc-import name="SiteHeader" hint-size="100%,60px"></dc-import>

  <main data-pagefind-meta="url:/contacto/" id="main-content" style="max-width:1180px; margin:0 auto; padding:48px 20px 40px;">

    <nav aria-label="Miga de pan" style="margin-bottom:20px;">
      <a href="index.html" style="font-size:14px; color:#b7ab8a;">Notofilia</a>
      <span style="font-size:14px; color:#b7ab8a; margin:0 8px;">/</span>
      <span style="font-size:14px; color:#e7ddc4;">Contacto</span>
    </nav>

    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:clamp(28px,4vw,64px); align-items:start;">

      <div style="position:relative; display:flex; align-items:center; justify-content:center; padding:190px 24px 24px; min-height:420px; box-sizing:border-box;">
        <picture>
          <source srcset="uploads/doblones-coloniales-oro-360.webp 360w, uploads/doblones-coloniales-oro.webp 511w" type="image/webp" sizes="(max-width: 700px) 70vw, 360px" />
          <source srcset="uploads/doblones-coloniales-oro-360.png 360w, uploads/doblones-coloniales-oro.png 511w" type="image/png" sizes="(max-width: 700px) 70vw, 360px" />
          <img src="uploads/doblones-coloniales-oro.png" alt="Doblones de oro coloniales españoles, moneda macuquina de 8 y 4 escudos" style="display:block; width:100%; max-width:360px; height:auto; filter:drop-shadow(0 18px 30px rgba(0,0,0,0.55));" loading="lazy" />
        </picture>
      </div>

      <div>
        <h1 style="font-family:'Montenegrin Gothic One', serif; font-weight:400; font-size:clamp(28px,4vw,42px); color:#e7ddc4; margin:0 0 14px;">Contacto</h1>
        <p style="font-size:18px; line-height:1.6; color:#b7ab8a; margin:0 0 32px;">¿Preguntas sobre el catálogo, el glosario o alguna pieza? Escríbenos y te responderemos por correo.</p>

        <form id="web3forms-contact-form" name="web3forms-contact-form" action="https://api.web3forms.com/submit" method="POST" ref="{{ formRef }}" onSubmit="{{ handleSubmit }}">
      <input type="hidden" name="access_key" value="ca9bc7d8-b852-43ba-829b-db452413852d" />
      <input type="hidden" name="subject" value="Nuevo mensaje de contacto — Notofilia.com" />
      <input type="checkbox" name="botcheck" tabIndex="-1" autoComplete="off" style="display:none;" />

      <div style="display:flex; flex-wrap:wrap; gap:16px; margin-bottom:16px;">
        <div style="flex:1 1 200px; text-align:left;">
          <label htmlFor="cf-name" style="display:block; font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:#b7ab8a; margin-bottom:8px;">Nombre <span aria-hidden="true" style="color:#6b521f;">*</span></label>
          <input type="text" name="name" id="cf-name" required="{{ true }}" style="width:100%; box-sizing:border-box; background:#d8d2cd; border:1px solid rgba(10,10,9,0.18); border-radius:2px; padding:12px 14px; font-family:'Cormorant Garamond', serif; font-size:17px; color:#1c1a15; min-height:44px;" />
        </div>
        <div style="flex:1 1 200px; text-align:left;">
          <label htmlFor="cf-email" style="display:block; font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:#b7ab8a; margin-bottom:8px;">Correo electrónico <span aria-hidden="true" style="color:#6b521f;">*</span></label>
          <input type="email" name="email" id="cf-email" required="{{ true }}" style="width:100%; box-sizing:border-box; background:#d8d2cd; border:1px solid rgba(10,10,9,0.18); border-radius:2px; padding:12px 14px; font-family:'Cormorant Garamond', serif; font-size:17px; color:#1c1a15; min-height:44px;" />
        </div>
      </div>

      <div style="text-align:left; margin-bottom:24px;">
        <label htmlFor="cf-country" style="display:block; font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:#b7ab8a; margin-bottom:8px;">País de donde me escribes</label>
        <input type="text" name="country" id="cf-country" style="width:100%; box-sizing:border-box; background:#d8d2cd; border:1px solid rgba(10,10,9,0.18); border-radius:2px; padding:12px 14px; font-family:'Cormorant Garamond', serif; font-size:17px; color:#1c1a15; min-height:44px;" />
      </div>

      <div style="text-align:left; margin-bottom:24px;">
        <label htmlFor="cf-message" style="display:block; font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:#b7ab8a; margin-bottom:8px;">Mensaje <span aria-hidden="true" style="color:#6b521f;">*</span></label>
        <textarea name="message" id="cf-message" required="{{ true }}" rows="{{ 6 }}" style="width:100%; box-sizing:border-box; background:#d8d2cd; border:1px solid rgba(10,10,9,0.18); border-radius:2px; padding:12px 14px; font-family:'Cormorant Garamond', serif; font-size:17px; color:#1c1a15; resize:vertical;"></textarea>
      </div>

      <div ref="{{ turnstileRef }}" style="display:flex; justify-content:center; margin:0 0 24px; min-height:65px;"></div>

        <p role="status" aria-live="polite" style="{{ statusStyle }}">{{ statusMessage }}</p>

      <div style="text-align:left;">
        <button type="submit" disabled="{{ submitDisabled }}" style="border:1px solid #e7ddc4; background:#e7ddc4; color:#0a0a09; font-family:'Cormorant Garamond', serif; font-weight:600; font-size:16px; letter-spacing:0.14em; text-transform:uppercase; padding:14px 40px; border-radius:999px; cursor:pointer; min-height:44px; opacity:{{ submitOpacity }};" style-hover="background:transparent; color:#e7ddc4;" style-focus="outline:2px solid #e7ddc4; outline-offset:3px;">{{ submitButtonLabel }}</button>

      </form>
      </div>

  <dc-import name="SiteFooter" hint-size="100%,140px"></dc-import>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 700, &quot;height&quot;: 900}}">
class Component extends DCLogic {
  state = { status: "idle" };

  formRef = React.createRef();
  turnstileRef = React.createRef();
  turnstileWidgetId = null;
  turnstilePollTimer = null;

  texts = {
    sendingLabel: "Enviando…",
    submitLabel: "Enviar mensaje",
    successMessage: "¡Gracias! Tu mensaje fue enviado correctamente.",
    errorMessage: "Hubo un error al enviar el formulario. Inténtalo de nuevo.",
    turnstileRequiredMessage: "Por favor completa la verificación de seguridad."
  };

  handleSubmit = async (e) => {
    e.preventDefault();
    const formEl = this.formRef.current;
    if (!formEl) return;
    const data = new FormData(formEl);
    if (data.get("botcheck")) return;
    const turnstileToken = data.get("cf-turnstile-response");
    if (!turnstileToken) {
      this.setState({ status: "turnstile-required" });
      return;
    }
    this.setState({ status: "sending" });
    try {
      const res = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { Accept: "application/json" },
        body: data
      });
      const json = await res.json();
      if (json && json.success) {
        this.setState({ status: "success" });
        formEl.reset();
        if (typeof window !== "undefined" && window.turnstile && this.turnstileWidgetId != null) {
          window.turnstile.reset(this.turnstileWidgetId);
        }
      } else {
        this.setState({ status: "error" });
      }
    } catch (err) {
      this.setState({ status: "error" });
    }
  };

  mountTurnstile = () => {
    if (this.turnstileWidgetId != null) return;
    const container = this.turnstileRef.current;
    if (!container) {
      this.turnstilePollTimer = setTimeout(this.mountTurnstile, 150);
      return;
    }
    if (typeof window !== "undefined" && window.turnstile && typeof window.turnstile.render === "function") {
      this.turnstileWidgetId = window.turnstile.render(container, {
        sitekey: "0x4AAAAAADvt7AgpnTMnMZh6",
        theme: "light"
      });
    } else {
      this.turnstilePollTimer = setTimeout(this.mountTurnstile, 150);
    }
  };

  componentDidMount() {
    this.mountTurnstile();
  }

  componentWillUnmount() {
    if (this.turnstilePollTimer) clearTimeout(this.turnstilePollTimer);
    if (this.turnstileWidgetId != null && typeof window !== "undefined" && window.turnstile && window.turnstile.remove) {
      window.turnstile.remove(this.turnstileWidgetId);
    }
  }

  renderVals() {
    const t = this.texts;
    const status = this.state.status;
    const statusCopy = {
      idle: "",
      sending: t.sendingLabel,
      success: t.successMessage,
      error: t.errorMessage,
      "turnstile-required": t.turnstileRequiredMessage
    };
    const statusMessage = statusCopy[status];
    const statusColor = status === "success" ? "#7fbf82" : (status === "idle" || status === "sending") ? "#b7ab8a" : "#e08a8a";
    const statusStyle = "font-family:'Cormorant Garamond', serif; font-size:16px; line-height:1.5; margin:" + (status === "idle" ? "0" : "0 0 20px") + "; text-align:center; color:" + statusColor + "; display:" + (status === "idle" ? "none" : "block") + ";";
    return {
      formRef: this.formRef,
      turnstileRef: this.turnstileRef,
      handleSubmit: this.handleSubmit,
      statusStyle,
      statusMessage,
      submitDisabled: status === "sending",
      submitOpacity: status === "sending" ? 0.6 : 1,
      submitButtonLabel: status === "sending" ? t.sendingLabel : t.submitLabel
    };
  }
}

</script>
</body>
</html>
