<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a href="{{ href }}" style="display:flex; flex-direction:column; height:100%; text-decoration:none; background:#d8d2cd; border:1px solid rgba(10,10,9,0.1); border-radius:3px; overflow:hidden; box-shadow:0 14px 34px rgba(0,0,0,0.35); transition:transform 0.15s ease;" style-hover="transform:translateY(-3px);">
  <div style="background:#fff; padding:14px; border-bottom:1px solid rgba(10,10,9,0.08); aspect-ratio:4/3; position:relative; overflow:hidden; box-sizing:border-box;">
    <picture style="position:absolute; inset:14px; display:block;">
      <source srcset="{{ imageWebp }}" type="image/webp" />
      <img src="{{ image }}" alt="{{ alt }}" width="400" height="300" loading="lazy" decoding="async" style="display:block; width:100%; height:100%; object-fit:contain;" />
    </picture>
  </div>
  <div style="padding:20px 22px 24px; display:flex; flex-direction:column; gap:6px; flex:1;">
    <span style="font-family:'Cormorant Garamond', serif; font-size:13px; letter-spacing:0.16em; text-transform:uppercase; color:#5c4e33;">{{ denomination }} &middot; {{ year }}</span>
    <span style="font-family:'Montenegrin Gothic One', serif; font-weight:400; font-size:22px; line-height:1.15; color:#1c1a15;">{{ title }}</span>
  </div>
</a>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 320, &quot;height&quot;: 300}, &quot;image&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;imageWebp&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;alt&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;The State Bank at New Brunswick&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;denomination&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;$1.00&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;year&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;c. 1860&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;href&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;#&quot;, &quot;tsType&quot;: &quot;string&quot;}}"></script>
</body>
</html>
