name: Site integrity

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Astro 7 requires Node >=22.12.0
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Astro content and types
        run: npm run check

      - name: Build production site and search index
        run: npm run build

      - name: Fail the build on unresolved Mustache in shipped HTML
        run: npm run check:mustache

      - name: Fail on unresolved template placeholders in shipped output
        run: npm run check:placeholders

      - name: Validate production security header baseline
        run: npm run check:headers

      - name: Check sitemap, redirects, search, and canonicals
        run: npm run check:drift

      - name: Fail on hard-coded inventory counts
        run: npm run check:inventory

      - name: Fail if re-sourced fichas have a retail citation majority
        run: npm run check:citations

      - name: Ensure generated sitemap is committed
        run: git diff --exit-code -- public/sitemap.xml

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Astro 7 requires Node >=22.12.0
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site and search index
        run: npm run build

      - name: Lighthouse CI budgets (home, coleccion, large catalog, noticia)
        run: npm run lighthouse:ci
        # Performance starts as warn in lighthouserc.json; a11y/SEO/BP are errors.
        # Re-measure against CrUX after deploy — simulated scores are not live RUM.

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build production site and search index
        run: npm run build

      - name: Playwright a11y + visual regression
        run: npm run test:e2e
