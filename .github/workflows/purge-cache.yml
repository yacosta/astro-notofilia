name: Purge Cloudflare cache

on:
  workflow_dispatch:
  # Every production Pages deploy is triggered by a push to main. Edge cache
  # must be purged after those deploys so new catalog URLs are not stuck as
  # cached 404s (Cloudflare can HIT a negative cache on the custom domain).
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: purge-cf-cache
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Cloudflare Pages production deploy
        run: |
          # Git-connected Pages starts in parallel with this workflow. New
          # catalog paths can 404 at the origin until that build is live;
          # purging too early re-caches the 404 on the custom domain.
          sleep 180
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Purge notofilia.com edge cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ZONE_NAME: notofilia.com
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set."
            echo "Add a Cloudflare API token with Zone → Cache Purge + Zone → Zone → Read"
            echo "for notofilia.com as repository secret CLOUDFLARE_API_TOKEN."
            echo "The existing DNS-AID token may only have Zone.DNS Edit; Cache Purge is a separate permission."
            exit 1
          fi
          node scripts/purge-cf-cache.mjs
